{%- comment -%}
Patička pod d3 grafem: zdroj + „Stáhnout: PNG, SVG“, jako v interaktivním přehledu
ETS (studie/2026-interaktivni-prehled-ets). Stahování obstarává
assets-local/js/chart-download.js — musí být v extra-scripts stránky.
  svg       id <svg> grafu
  file      název staženého souboru bez přípony
  source    HTML řádku se zdrojem („Zdroj: …“)
  subtitle  nepovinné: selektor poznámky, která se v souboru vykreslí nad graf
{%- endcomment -%}
<style>
.chart-foot { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: flex-end; gap: 4px 16px; margin-bottom: 2rem; padding-top: .4rem; font-size: .8rem; color: #a0aec0; }
.chart-foot a, .chart-foot a:hover { color: #a0aec0; }
/* "Stáhnout: PNG, SVG" reads as one phrase, so the footer's wrapping must not split it. */
.chart-foot .chart-downloads { white-space: nowrap; }
.chart-foot .chart-download { background: none; border: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
.chart-foot .chart-download:hover { text-decoration: underline; }
</style>
<div class="chart-foot">
  <span id="{{ include.svg }}-zdroj">{{ include.source }}</span>
  <span class="chart-downloads">Stáhnout:
    <button type="button" class="chart-download" data-format="png" data-svg="{{ include.svg }}" data-filename="{{ include.file }}.png" data-source="#{{ include.svg }}-zdroj"{% if include.subtitle %} data-subtitle="{{ include.subtitle }}"{% endif %}>PNG</button>,
    <button type="button" class="chart-download" data-svg="{{ include.svg }}" data-filename="{{ include.file }}.svg" data-source="#{{ include.svg }}-zdroj"{% if include.subtitle %} data-subtitle="{{ include.subtitle }}"{% endif %}>SVG</button>
  </span>
</div>
