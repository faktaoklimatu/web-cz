{%- comment -%}
A d3 chart in the CBAM / ETS dashboard style: a title, an empty <svg> the page
script draws into (legend and unit caption included, so the PNG/SVG export
carries them), and the "Zdroj: … Stáhnout: PNG, SVG" foot that
assets-local/js/chart-download.js wires up. Styles: assets-local/_chart-panel.scss.

The title is a div, not an h2, so it stays out of the article's table of contents.

Params: id (required), title, source (HTML, e.g. '<a href="…">Ember</a>'),
class (extra classes on the panel, e.g. wide-figure-desktop; no-title hides the
title on the page; the export keeps it, at data-export-size)
{%- endcomment -%}
<div class="d3-panel {{ include.class }}" id="{{ include.id }}">
  <div class="d3-title" id="{{ include.id }}-title" data-export-size="21">{{ include.title }}</div>
  <div class="d3-body">
  <svg id="{{ include.id }}-svg"></svg>
  <div class="chart-foot">
    <span id="{{ include.id }}-source">Zdroj: {{ include.source }}</span>
    <span class="chart-downloads">Stáhnout:
      <button type="button" class="chart-download" data-format="png" data-svg="{{ include.id }}-svg" data-filename="{{ include.id }}.svg" data-title="#{{ include.id }}-title" data-source="#{{ include.id }}-source">PNG</button>,
      <button type="button" class="chart-download" data-svg="{{ include.id }}-svg" data-filename="{{ include.id }}.svg" data-title="#{{ include.id }}-title" data-source="#{{ include.id }}-source">SVG</button>
    </span>
  </div>
  </div>
</div>
