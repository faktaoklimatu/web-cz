<figure class="ets2-kalk" id="kalkulacka">
  <h3 class="js-toc-ignore">Kolik by ETS2 stálo typovou domácnost?</h3>
  <p class="kalk-sub">Vyberte bydlení, vytápění a cenu povolenky. Náklad ETS2 v Kč měsíčně včetně DPH, ceny roku 2028.</p>

  <fieldset class="kalk-volba">
    <legend>Kde domácnost bydlí</legend>
    <label><input type="radio" name="home" value="rd" checked><span>Rodinný dům</span></label>
    <label><input type="radio" name="home" value="byt"><span>Byt</span></label>
  </fieldset>
  <fieldset class="kalk-volba">
    <legend>Čím topí</legend>
    <div class="kalk-grp" data-home="rd">
      <label><input type="radio" name="heat" value="1279" checked><span>Uhlí</span></label>
      <label><input type="radio" name="heat" value="913"><span>Hlavně uhlí, přitápí dřevem</span></label>
      <label><input type="radio" name="heat" value="439"><span>Zemní plyn</span></label>
      <label><input type="radio" name="heat" value="0"><span>Tepelné čerpadlo, dřevo nebo pelety</span></label>
    </div>
    <div class="kalk-grp" data-home="byt" hidden>
      <label><input type="radio" name="heat" value="259"><span>Plynový kotel v bytě nebo domě</span></label>
      <label><input type="radio" name="heat" value="287"><span>Dálkové teplo z menší výtopny (pod ETS2)</span></label>
      <label><input type="radio" name="heat" value="0"><span>Dálkové teplo z velké teplárny (už v ETS1)</span></label>
      <label><input type="radio" name="heat" value="0"><span>Tepelné čerpadlo nebo elektřina</span></label>
    </div>
  </fieldset>

  <div class="kalk-cena"><span id="kalk-eur">61</span> € za povolenku <span class="kalk-pozn">(<span id="kalk-czk">1 476</span> Kč)</span></div>
  <div class="kalk-slider">
    <div class="kalk-pasmo" aria-hidden="true"></div>
    <input type="range" id="kalk-input" min="30" max="150" step="1" value="61" aria-label="Cena povolenky v eurech za tunu" aria-describedby="kalk-pasmo-pozn">
  </div>
  <div class="kalk-skala" aria-hidden="true"><span>30 €</span><span>150 €</span></div>

  <div class="kalk-radek" aria-live="polite"><div class="kalk-jmeno" id="kalk-nazev"></div><div><span class="kalk-mesic"></span> Kč měsíčně</div><div class="kalk-rok"><span></span> Kč ročně</div></div>

  <p class="kalk-pozn" id="kalk-pasmo-pozn">Zvýrazněné pásmo na posuvníku = pravděpodobné pásmo ceny v roce 2028. Dolní hranice odpovídá našemu základnímu scénáři: <a href="https://eur-lex.europa.eu/legal-content/CS/TXT/?uri=CELEX:32023L0959">evropská pravidla</a> mají cenu nad zhruba 45 € v cenách 2020, tedy 61 € v roce 2028, tlumit uvolňováním povolenek z rezervy. Horní hranice je <a href="https://www.ice.com/products/83048353/EUA-2-Futures/expiry">cena budoucích kontraktů na prosinec 2028</a> z 1. 10. 2026, asi 76 €.</p>
  <p class="kalk-pozn kalk-kurz">Směnný kurz: 1 € = <span id="kalk-kurz">24,2</span> Kč (<a href="https://www.cnb.cz/cs/menova-politika/prognoza/">prognóza ČNB pro rok 2028</a>), náklad zahrnuje DPH</p>
  <div class="kalk-zdroj">Zdroj: spotřeby typových domácností z <a href="https://csu.gov.cz/produkty/spotreba-paliv-a-energii-v-domacnostech-energo-2021">ČSÚ ENERGO 2021</a>, emisní faktory <a href="https://mzp.gov.cz/system/files/2026-02/opok-Vypoctove_faktory_2025_ETS2-20260213.pdf">ČHMÚ</a>. Náklad roste lineárně s cenou povolenky. Elektroauto ani tepelné čerpadlo ETS2 nezatíží: elektřina spadá pod stávající systém ETS1 a její cenu ETS2 nemění.</div>
</figure>
