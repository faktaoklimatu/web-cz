    <div class="ets2-src">Zdroj: výpočet Fakt o klimatu z ČSÚ EU-SILC 2024 a ENERGO 2021. Počty domácností jsou zaokrouhlené odhady z výběrového šetření; 95% intervaly spolehlivosti: celkem 267–317 tis., rodinné domy na uhlí 35–53 tis., na plyn 105–136 tis., byty na plyn 37–64 tis., byty na teple ze zdroje v ETS2 29–38 tis., náklady jsou v našem základním scénáři (asi 60 eur za tunu). Počítáme s průměrnou spotřebou domů a bytů. V nezatepleném rodinném domě by byl dopad vyšší. Přitom zhruba polovina rodinných domů spadá do energetických tříd E–G, ukázal <a href="https://mpo.gov.cz/assets/cz/energetika/uspory-energie/aktuality/2026/11/Tematicky-report_Mikroregionalni_ukazatel_energeticke_chudoby_MF.pdf">mikroregionální report ministerstva financí</a>.</div>
