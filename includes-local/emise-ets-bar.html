<style>
.ets-bar { margin: 2rem 0; }
.ets-bar .track { display: flex; gap: 4px; height: 40px; }
.ets-bar .seg { flex: 1 1 0; min-width: 2px; }
.ets-bar .labels { display: flex; gap: 4px; margin-top: 0.6rem; }
.ets-bar .labels > div { flex: 1 1 0; min-width: 0; white-space: nowrap; line-height: 1.25; }
.ets-bar .labels .name { font-weight: 700; }
.ets-bar .labels .pct { font-variant-numeric: tabular-nums; }
.ets-bar .source { font-size: 0.8rem; opacity: 0.7; margin-top: 1rem; }
@media (max-width: 640px) {
  .ets-bar .track { height: 28px; }
  .ets-bar .labels { display: block; }
  .ets-bar .labels > div { text-align: left !important; margin-top: 0.5rem; }
  .ets-bar .labels .name, .ets-bar .labels .pct { display: inline; }
  .ets-bar .labels .pct::before { content: " — "; }
}
</style>

<div class="ets-bar" id="ets-bar">
  <div class="track"></div>
  <div class="labels"></div>
  <div class="source">Zdroj: EEA, směrnice o ETS, Transport &amp; Environment</div>
</div>

<script>
(function () {
  // Uprav jen tohle pole (hodnoty v Mt CO2eq, 2024) – zbytek se vykreslí sám.
  // align: kam se zarovná popisek pod dílem ("left" / "right")
  var DATA = [
    { label: "ETS1 nyní", value: 1186.5, color: "#6c6cd6", align: "left"  },
    { label: "ETS1 nově", value: 66.2,   color: "#3b3b93", align: "left", prefix: "+ " },
    { label: "ETS2",      value: 1261,   color: "#b5b8bd", align: "right" },
    { label: "Mimo ETS",  value: 529.3,  color: "#d3d5d9", align: "right" }
  ];

  var root = document.getElementById("ets-bar");
  var track = root.querySelector(".track");
  var labels = root.querySelector(".labels");
  var total = DATA.reduce(function (a, d) { return a + d.value; }, 0);

  DATA.forEach(function (d) {
    var pct = (d.value / total * 100).toFixed(1).replace(".", ",") + " %";

    var seg = document.createElement("div");
    seg.className = "seg";
    seg.style.background = d.color;
    seg.style.flexGrow = d.value;
    seg.title = d.label + ": " + d.value + " Mt (" + pct + ")";
    track.appendChild(seg);

    var cell = document.createElement("div");
    cell.style.flexGrow = d.value;
    cell.style.color = d.color;
    cell.style.textAlign = d.align || "left";
    cell.innerHTML = '<div class="name">' + (d.prefix || "") + d.label + "</div>" +
                     '<div class="pct">' + pct + "</div>";
    labels.appendChild(cell);
  });
})();
</script>
