{%- assign slide_id = include.id | default: "slide" -%}
{%- assign slide_title = include.title | default: "" -%}
{%- assign slide_subtitle = include.subtitle | default: "" -%}

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
</style>

<div class="slide-wrap" id="wrap-{{ slide_id }}" style="width:90vw;position:relative;left:50%;transform:translateX(-50%)">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    id="{{ slide_id }}"
    viewBox="0 0 1920 1080"
    width="1920"
    height="1080"
    style="width:100%;height:auto;display:block"
  >
    <!-- Background -->
    <rect width="1920" height="1080" fill="#ffffff"/>

    <!-- 12-column grid (hidden by default)
         Margins 90px · Content width 1740px · col 123px · gutter 24px
         Col start: x = 90 + i×147   (i = 0–11)   Last col ends at x=1830
         To show: remove display="none" -->
    <g id="{{ slide_id }}-grid" display="none">
      <rect x="90"   y="0" width="123" height="1020" fill="#1a7a85" fill-opacity="0.07"/>
      <rect x="237"  y="0" width="123" height="1020" fill="#1a7a85" fill-opacity="0.07"/>
      <rect x="384"  y="0" width="123" height="1020" fill="#1a7a85" fill-opacity="0.07"/>
      <rect x="531"  y="0" width="123" height="1020" fill="#1a7a85" fill-opacity="0.07"/>
      <rect x="678"  y="0" width="123" height="1020" fill="#1a7a85" fill-opacity="0.07"/>
      <rect x="825"  y="0" width="123" height="1020" fill="#1a7a85" fill-opacity="0.07"/>
      <rect x="972"  y="0" width="123" height="1020" fill="#1a7a85" fill-opacity="0.07"/>
      <rect x="1119" y="0" width="123" height="1020" fill="#1a7a85" fill-opacity="0.07"/>
      <rect x="1266" y="0" width="123" height="1020" fill="#1a7a85" fill-opacity="0.07"/>
      <rect x="1413" y="0" width="123" height="1020" fill="#1a7a85" fill-opacity="0.07"/>
      <rect x="1560" y="0" width="123" height="1020" fill="#1a7a85" fill-opacity="0.07"/>
      <rect x="1707" y="0" width="123" height="1020" fill="#1a7a85" fill-opacity="0.07"/>
    </g>

    <!-- Title: top at y=100, x=90, font-size 42 -->
    <text
      x="90" y="100"
      font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
      font-size="42" font-weight="700" fill="#333333"
      dominant-baseline="text-before-edge"
    >{{ slide_title }}</text>

    {%- if slide_subtitle != "" %}
    <text
      x="90" y="150"
      font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
      font-size="24" font-weight="400" fill="#666666"
      dominant-baseline="text-before-edge"
    >{{ slide_subtitle }}</text>
    {%- endif %}

    <!-- Footer (y 1020–1080) -->

    <!-- Content: 1920×1080 canvas, scales to 90vw via viewBox
         Left/right margin: 90px   Content starts: y=210   Footer: y=1020
         Safe area: x 90–1830, y 210–1020
         Title: x=90, y=100 (font-size 42)   Body: font-size 21, fill #333333 -->
    {{ include.content }}
  </svg>

  <div style="display:flex;justify-content:center;margin-top:4px">
    <button
      class="chart-dl-btn"
      onclick="(function(){
        var svg = document.getElementById('{{ slide_id }}');
        var src = new XMLSerializer().serializeToString(svg);
        var url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);
        var a = document.createElement('a');
        a.href = url;
        a.download = '{{ slide_id }}.svg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      })()"
    >↓ SVG</button>
  </div>
</div>
