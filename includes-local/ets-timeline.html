<style>
.ets-timeline { display: flex; gap: 4px; margin: 2rem 0; }
.ets-timeline .phase { flex: 1 1 0; min-width: 0; }
.ets-timeline .name { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.04em; text-align: center; margin-bottom: 0.4rem; }
.ets-timeline .track { position: relative; height: 22px; }
.ets-timeline .track::before { content: ""; position: absolute; top: 50%; left: 0; right: 0; border-top: 2px solid currentColor; }
.ets-timeline .phase.open { color: #3b3b93; }
.ets-timeline .phase.open .name { font-weight: 700; }
.ets-timeline .phase.open .track::before { border-top-style: dashed; }
.ets-timeline .dot { position: absolute; top: 50%; width: 12px; height: 12px; margin-top: -6px; border: 2px solid currentColor; border-radius: 50%; background: var(--body-bg, #fff); }
.ets-timeline .dot.start { left: 0; }
.ets-timeline .dot.end { right: 0; }
.ets-timeline .years { display: flex; justify-content: space-between; font-size: 0.8rem; margin-top: 0.2rem; }
.ets-timeline .note { font-size: 0.8rem; font-style: italic; line-height: 1.2; text-align: left; margin-top: 0.5rem; }
@media (max-width: 640px) {
  .ets-timeline { flex-direction: column; gap: 1rem; }
  .ets-timeline .note { margin-top: 0.2rem; }
}
</style>

{%- assign typ = include.typ | default: "faze" %}
<div class="ets-timeline" id="ets-timeline-{{ typ }}"></div>

<script>
(function () {
  // Uprav jen tato pole – zbytek se vykreslí sám. Použití:
  // {% raw %}{% include includes-local/ets-timeline.html typ="proces" %}{% endraw %} (bez typ = fáze ETS)
  var DATA = {
    // Šířka fáze = počet let; otevřená fáze (to: null) má OPEN_WEIGHT.
    faze: [
      { name: "Fáze I",   from: 2005, to: 2007, note: "pilotní fáze" },
      { name: "Fáze II",  from: 2008, to: 2012, note: "první skutečné snižování emisního stropu" },
      { name: "Fáze III", from: 2013, to: 2020, note: "jednotný evropský strop, aukce jako hlavní způsob přidělování povolenek" },
      { name: "Fáze IV",  from: 2021, to: 2030, note: "zpřísnění v rámci Green Dealu / Fit for 55" },
      { name: "Fáze V",   from: 2031, to: null, note: "předmět navrhované revize" }
    ],
    // Kroky jsou stejně široké; open: true = očekávaný krok (čárkovaně).
    proces: [
      { name: "Návrh",       from: "17. 6. 2026",           note: "Evropská komise zveřejnila návrh revize" },
      { name: "Pozice",      from: "podzim / zima 2026",    note: "očekávaná příprava a schválení pozic Evropského parlamentu a Rady EU k návrhu", open: true },
      { name: "Trialog",     from: "po schválení pozic",    note: "Evropská komise, Rada EU a Evropský parlament se v trialogu dohodnou na kompromisní podobě směrnice", open: true },
      { name: "Schválení",   from: "1. polovina 2027",      note: "očekávané schválení výsledné podoby směrnice (EP a Rada EU)", open: true },
      { name: "Transpozice", from: "po schválení směrnice", note: "členské státy musí směrnici transponovat do svých právních řádů", open: true }
    ]
  };
  var OPEN_WEIGHT = 5; // šířka otevřené fáze v „letech“

  var root = document.getElementById("ets-timeline-{{ typ }}");
  DATA["{{ typ }}"].forEach(function (p) {
    var hasEnd = p.to != null;  // only closed phases get an end dot and end year
    var open = p.open || p.to === null;
    var weight = typeof p.from === "number" ? (hasEnd ? p.to - p.from + 1 : OPEN_WEIGHT) : 1;

    var el = document.createElement("div");
    el.className = "phase" + (open ? " open" : "");
    el.style.flexGrow = weight;

    var dots = '<span class="dot start"></span>' + (hasEnd ? '<span class="dot end"></span>' : "");
    el.innerHTML =
      '<div class="name">' + p.name + "</div>" +
      '<div class="track">' + dots + "</div>" +
      '<div class="years"><span>' + p.from + "</span><span>" + (hasEnd ? p.to : "") + "</span></div>" +
      '<div class="note">' + p.note + "</div>";

    root.appendChild(el);
  });
})();
</script>
